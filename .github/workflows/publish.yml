name: Publish npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed release tag matching package version (v2026.10.8-cogine.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - name: Verify release tag and npm CLI
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          execFileSync('git', ['show-ref', '--verify', `refs/tags/${process.env.RELEASE_TAG}`]);
          execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/main']);
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'npm >=11.5.1 required');
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pack
      - name: Pack and publish reviewed artifact
        run: |
          mkdir release-artifact
          pnpm pack --pack-destination release-artifact
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac
          npm publish release-artifact/*.tgz --access public --tag "$NPM_TAG" --provenance
